<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Everything Will Be Okay</title>
<style>
  :root {
    --bg-top: #fdf2f8; --bg-mid: #fde7ef; --bg-bottom: #fff7ed;
    --text: #9d2a5b; --stem: #6fbf7e; --leaf: #86c98f;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: linear-gradient(var(--bg-top), var(--bg-mid) 55%, var(--bg-bottom)); font-family: Georgia, "Times New Roman", serif; }
  #scene { position: fixed; inset: 0; overflow: hidden; }
  #garden { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  #text {
    position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 9%);
    margin: 0; padding: 0 24px; text-align: center; color: var(--text);
    font-size: clamp(1.7rem, 6.5vw, 2.8rem); font-weight: 600; line-height: 1.3; font-style: italic;
    text-shadow: 0 0 14px #fff, 0 0 6px #fff, 0 0 2px #fff;
  }
  .line { display: block; }
  .word { display: inline-block; margin-right: .25em; opacity: 0; transform: translateY(12px); transition: opacity 1s ease, transform 1s ease; }
  .word.on { opacity: 1; transform: none; }
  .stem { fill: none; stroke: var(--stem); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 2.4s ease-out; }
  .grow .stem { stroke-dashoffset: 0; }
  .leaf { fill: var(--leaf); transform: scale(0); transform-origin: 0 0; transition: transform 1s ease-out; }
  .petal { transform: scale(0); transform-origin: 0 0; transition: transform 1.4s cubic-bezier(.2, 1.4, .4, 1); }
  .swaying { animation: sway 4.5s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  .fall { position: absolute; top: -30px; opacity: .8; animation: fall linear infinite; animation-play-state: paused; pointer-events: none; }
  .go .fall { animation-play-state: running; }
  @keyframes fall { to { transform: translate(30px, 110vh) rotate(360deg); } }
  #start { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(var(--bg-top), var(--bg-mid) 55%, var(--bg-bottom)); transition: opacity 1s ease; }
  #start.hide { opacity: 0; pointer-events: none; }
  #go { border: 0; border-radius: 999px; padding: 16px 34px; font: inherit; font-size: 1.15rem; font-style: italic;
    color: #fff; background: #e0568f; cursor: pointer; box-shadow: 0 8px 24px rgba(224, 86, 143, .35); }
  #mute { position: fixed; z-index: 10; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; width: 40px; height: 40px;
    border: 0; border-radius: 50%; background: rgba(255, 255, 255, .7); font-size: 1.1rem; cursor: pointer; }
</style>
</head>

<script>
  // ===== CONFIG: ganti sesuai kebutuhan =====
  var CONFIG = {
    lines: ["Everything Will Be Okay,", "Because Jesus Is With Us"],
    startLabel: "Tap untuk mulai 🌸",
    wordMs: 480,      // jeda antar kata muncul
    density: 6000,    // makin kecil angkanya, makin rapat bunganya
    maxFlowers: 90,
    fillMs: 16000     // bunga terus bermunculan sampai layar penuh dalam sekian ms
  };
  // ==========================================

  var NS = "http://www.w3.org/2000/svg";
  var COLORS = ["#f9a8c9", "#ffd6e0", "#fff1b8", "#ffffff", "#f7b8ff", "#ffc2a1", "#c9e7ff"];
  var svg = document.getElementById("garden");
  var audio = document.getElementById("audio");
  var flowers = [];

  document.getElementById("go").textContent = CONFIG.startLabel;

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  }

  function build() {
    var W = window.innerWidth, H = window.innerHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    var s = Math.min(Math.max(W / 400, 0.9), 1.6);
    var n = Math.min(CONFIG.maxFlowers, Math.max(50, Math.round(W * H / CONFIG.density)));
    var items = [];
    for (var i = 0; i < n; i++) items.push({top: H * (0.1 + Math.random() * 0.8), x: Math.random() * W});
    items.sort(function (a, b) { return a.top - b.top; });   // yang tinggi digambar dulu (di belakang)
    items.forEach(function (it, idx) {
      var x = it.x, top = it.top, depth = top / H;           // 0 = atas/jauh, 1 = bawah/dekat
      var lean = (Math.random() * 80 - 40) * s;
      var cx = Math.min(W - 10, Math.max(10, x + lean));
      var qx = x - lean * 0.6, qy = (H + top) / 2;
      var color = COLORS[Math.floor(Math.random() * COLORS.length)];
      var g = el("g", {class: "flower"});
      g.style.transformOrigin = x + "px " + H + "px";
      el("path", {d: "M" + x + " " + H + " Q" + qx + " " + qy + " " + cx + " " + top, class: "stem", pathLength: 1}, g);
      var leaves = [];
      [0.35, 0.6].forEach(function (t, j) {
        var px = (1 - t) * (1 - t) * x + 2 * (1 - t) * t * qx + t * t * cx;
        var py = (1 - t) * (1 - t) * H + 2 * (1 - t) * t * qy + t * t * top;
        var lg = el("g", {transform: "translate(" + px + " " + py + ") rotate(" + (j % 2 ? 55 : -55) + ")"}, g);
        leaves.push(el("ellipse", {cx: 0, cy: -10 * s, rx: 5 * s, ry: 12 * s, class: "leaf"}, lg));
      });
      var bg = el("g", {transform: "translate(" + cx + " " + top + ")"}, g);
      var r = (11 + Math.random() * 6) * s * (0.75 + 0.6 * depth), petals = [];
      var cnt = 6 + Math.floor(Math.random() * 4);
      for (var p = 0; p < cnt; p++) {
        var pg = el("g", {transform: "rotate(" + (p * 360 / cnt) + ")"}, bg);
        petals.push(el("ellipse", {cx: 0, cy: -r, rx: r * 0.55, ry: r, fill: color, class: "petal"}, pg));
      }
      for (var q = 0; q < cnt; q++) {
        var qg = el("g", {transform: "rotate(" + (q * 360 / cnt + 180 / cnt) + ")"}, bg);
        petals.push(el("ellipse", {cx: 0, cy: -r * 0.5, rx: r * 0.28, ry: r * 0.5, fill: "#fff", opacity: 0.55, class: "petal"}, qg));
      }
      petals.push(el("circle", {r: r * 0.4, fill: "#fbbf24", class: "petal"}, bg));
      // bunga bawah mekar lebih dulu, yang tinggi menyusul sampai layar penuh
      var delay = (1 - depth) * CONFIG.fillMs * 0.8 + Math.random() * CONFIG.fillMs * 0.2;
      flowers.push({g: g, leaves: leaves, petals: petals, delay: delay, sway: idx % 2 === 0});
    });
    var layer = document.getElementById("fallLayer");
    for (var f = 0; f < 30; f++) {
      var sp = document.createElement("span");
      sp.className = "fall";
      sp.textContent = f % 3 ? "🌸" : "✨";
      sp.style.left = Math.random() * 100 + "%";
      sp.style.fontSize = (12 + Math.random() * 12) + "px";
      sp.style.animationDuration = (8 + Math.random() * 8) + "s";
      sp.style.animationDelay = (Math.random() * 10) + "s";
      layer.appendChild(sp);
    }
  }

  function showText() {
    var h = document.getElementById("text"), t = 900;
    CONFIG.lines.forEach(function (line) {
      var l = document.createElement("span");
      l.className = "line";
      h.appendChild(l);
      line.split(" ").forEach(function (w) {
        var s = document.createElement("span");
        s.className = "word";
        s.textContent = w;
        l.appendChild(s);
        setTimeout(function () { s.classList.add("on"); }, t);
        t += CONFIG.wordMs;
      });
      t += 500;
    });
  }

  var gain = null, muted = false;
  function playWithContext(ctx) {
    // Cadangan: putar lewat Web Audio kalau elemen audio diblokir
    try {
      var raw = atob(audio.getAttribute("src").split(",")[1]);
      var bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      gain = ctx.createGain();
      gain.gain.value = muted ? 0 : 1;
      gain.connect(ctx.destination);
      ctx.decodeAudioData(bytes.buffer, function (buf) {
        var src = ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        src.connect(gain); src.start(0);
      });
    } catch (e) {}
  }

  function start() {
    document.getElementById("start").classList.add("hide");
    document.getElementById("scene").classList.add("go");
    var ctx = null;
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}
    audio.play().catch(function () { if (ctx) playWithContext(ctx); });
    flowers.forEach(function (f) {
      setTimeout(function () {
        f.g.classList.add("grow");
        f.leaves.forEach(function (l, j) {
          l.style.transitionDelay = (1.2 + j * 0.4) + "s";
          l.style.transform = "scale(1)";
        });
        setTimeout(function () {
          f.petals.forEach(function (p, j) {
            p.style.transitionDelay = (j * 0.08) + "s";
            p.style.transform = "scale(1)";
          });
          if (f.sway) f.g.classList.add("swaying");
        }, 2300);
      }, f.delay);
    });
    showText();
  }

  build();
  document.getElementById("go").addEventListener("click", start);
  document.getElementById("mute").addEventListener("click", function () {
    muted = !muted;
    audio.muted = muted;
    if (gain) gain.gain.value = muted ? 0 : 1;
    this.textContent = muted ? "🔇" : "🔊";
  });
</script>
